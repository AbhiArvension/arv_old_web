<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-label="Website Design and Development">
      
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#070c17"/>
        <stop offset="50%" stop-color="#0b1324"/>
        <stop offset="100%" stop-color="#080e1c"/>
      </linearGradient>
      <radialGradient id="glow-l" cx="15%" cy="85%" r="65%">
        <stop offset="0%" stop-color="#2563eb" stop-opacity="0.32"/>
        <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="glow-r" cx="85%" cy="15%" r="60%">
        <stop offset="0%" stop-color="#0891b2" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
      </radialGradient>
      <filter id="shadow-win" x="-10%" y="-10%" width="125%" height="125%">
        <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.6"/>
      </filter>
      <filter id="shadow-phone" x="-15%" y="-10%" width="130%" height="125%">
        <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.75"/>
      </filter>
      <filter id="shadow-chip" x="-10%" y="-20%" width="120%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
      </filter>
      <linearGradient id="chrome-bar" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#141f36"/>
        <stop offset="100%" stop-color="#101828"/>
      </linearGradient>
      <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0891b2"/>
        <stop offset="100%" stop-color="#066d86"/>
      </linearGradient>
    </defs>
    <!-- Background Canvas -->
