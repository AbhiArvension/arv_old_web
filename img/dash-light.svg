<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-label="Web Application Development">
      
    <defs>
      <filter id="shadow-win" x="-10%" y="-10%" width="125%" height="125%">
        <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.12"/>
      </filter>
      <filter id="shadow-phone" x="-15%" y="-10%" width="130%" height="125%">
        <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.16"/>
      </filter>
      <filter id="shadow-chip" x="-10%" y="-20%" width="120%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
      </filter>
    </defs>
    <!-- Background Canvas -->
    <rect width="1000" height="780" rx="36" fill="#0f172a"/>
    
    <!-- Subtle architectural guidelines -->
    <g stroke="#0f172a" stroke-opacity="0.05" stroke-width="1">
      <line x1="0" y1="130" x2="1000" y2="130"/>
      <line x1="0" y1="260" x2="1000" y2="260"/>
      <line x1="0" y1="390" x2="1000" y2="390"/>
      <line x1="0" y1="520" x2="1000" y2="520"/>
